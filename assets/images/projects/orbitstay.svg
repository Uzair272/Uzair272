<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="space-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="cosmic-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#space-glow)"/>

  <!-- Stars -->
  <circle cx="80" cy="50" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="150" cy="120" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="220" cy="40" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="480" cy="70" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="530" cy="160" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="390" cy="60" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="100" cy="280" r="1" fill="#fff" opacity="0.3"/>

  <!-- Earth horizon arc -->
  <path d="M-50 420 C150 250 450 250 650 420" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.7"/>
  <path d="M-50 425 C150 255 450 255 650 425" fill="#0284c7" opacity="0.25"/>

  <!-- Outer UI Glass Frame -->
  <rect x="40" y="35" width="520" height="290" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="url(#cosmic-ring)" stroke-width="1.5"/>
  
  <!-- Browser bar -->
  <rect x="40" y="35" width="520" height="36" rx="12" fill="#1e1b4b" fill-opacity="0.8"/>
  <circle cx="65" cy="53" r="5" fill="#ef4444"/>
  <circle cx="82" cy="53" r="5" fill="#eab308"/>
  <circle cx="99" cy="53" r="5" fill="#22c55e"/>
  <text x="300" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">OrbitStay • World's First Commercial Space Hotel</text>

  <!-- Orbital Station Concept Illustration -->
  <ellipse cx="300" cy="170" rx="120" ry="40" fill="none" stroke="url(#cosmic-ring)" stroke-width="3" stroke-dasharray="12 4"/>
  <circle cx="300" cy="170" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="300" cy="170" r="14" fill="#00e5ff" opacity="0.8"/>
  
  <!-- Solar Panels -->
  <rect x="180" y="162" width="55" height="16" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <rect x="365" y="162" width="55" height="16" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>

  <!-- UI Floating Glass Cards -->
  <g transform="translate(60, 215)">
    <rect width="140" height="85" rx="8" fill="#030712" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <text x="15" y="30" fill="#94a3b8" font-family="sans-serif" font-size="10">ORBIT ALTITUDE</text>
    <text x="15" y="55" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">408 km</text>
    <text x="15" y="72" fill="#38bdf8" font-family="monospace" font-size="9">Low Earth Orbit</text>
  </g>

  <g transform="translate(230, 225)">
    <rect width="140" height="75" rx="8" fill="#030712" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <text x="15" y="28" fill="#94a3b8" font-family="sans-serif" font-size="10">EXPERIENCE</text>
    <text x="15" y="48" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold">Zero-G Suites</text>
    <text x="15" y="64" fill="#e2e8f0" font-family="sans-serif" font-size="9">Glassmorphic UI</text>
  </g>

  <g transform="translate(400, 215)">
    <rect width="140" height="85" rx="8" fill="#030712" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <text x="15" y="30" fill="#94a3b8" font-family="sans-serif" font-size="10">RESERVATION</text>
    <rect x="15" y="44" width="110" height="28" rx="6" fill="url(#cosmic-ring)"/>
    <text x="70" y="62" fill="#030712" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Book Capsule</text>
  </g>
</svg>
