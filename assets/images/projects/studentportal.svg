<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="portal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#141829"/>
    </linearGradient>
    <linearGradient id="indigo-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#portal-bg)"/>

  <rect x="40" y="35" width="520" height="290" rx="12" fill="#0c1122" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="35" width="520" height="36" rx="12" fill="#121831"/>
  <circle cx="65" cy="53" r="5" fill="#ef4444"/>
  <circle cx="82" cy="53" r="5" fill="#eab308"/>
  <circle cx="99" cy="53" r="5" fill="#22c55e"/>
  <text x="300" y="58" fill="#c7d2fe" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Student Activity &amp; Campus Portal</text>

  <!-- Sidebar -->
  <rect x="55" y="85" width="130" height="225" rx="6" fill="#080c18"/>
  <text x="70" y="112" fill="#6366f1" font-family="sans-serif" font-size="11" font-weight="bold">CAMPUS HUB</text>
  <rect x="65" y="125" width="110" height="24" rx="4" fill="#6366f1" fill-opacity="0.2"/>
  <text x="75" y="141" fill="#c7d2fe" font-family="sans-serif" font-size="10">Overview</text>
  <text x="75" y="175" fill="#94a3b8" font-family="sans-serif" font-size="10">My Events</text>
  <text x="75" y="205" fill="#94a3b8" font-family="sans-serif" font-size="10">Clubs &amp; Societies</text>
  <text x="75" y="235" fill="#94a3b8" font-family="sans-serif" font-size="10">Badges Earned</text>

  <!-- Main Content Grid -->
  <!-- Stat cards -->
  <g transform="translate(200, 85)">
    <rect width="165" height="65" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="25" fill="#94a3b8" font-family="sans-serif" font-size="10">ACTIVITIES LOGGED</text>
    <text x="15" y="52" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="bold">42 Events</text>
  </g>
  <g transform="translate(380, 85)">
    <rect width="165" height="65" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="25" fill="#94a3b8" font-family="sans-serif" font-size="10">HOURS LOGGED</text>
    <text x="15" y="52" fill="#a855f7" font-family="sans-serif" font-size="22" font-weight="bold">128 hrs</text>
  </g>

  <!-- Featured Event Card -->
  <rect x="200" y="165" width="345" height="145" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="220" y="195" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Annual Tech Symposium 2026</text>
  <text x="220" y="215" fill="#94a3b8" font-family="sans-serif" font-size="11">FAST-NUCES • Hackathon &amp; Robotic Exhibition</text>
  <rect x="220" y="230" width="85" height="20" rx="4" fill="#059669" fill-opacity="0.2"/>
  <text x="262" y="244" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">REGISTERED</text>
  <rect x="420" y="255" width="110" height="35" rx="6" fill="url(#indigo-accent)"/>
  <text x="475" y="277" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">View Details</text>
</svg>
