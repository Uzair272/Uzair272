<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="med-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f2b3c"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#med-grad)"/>
  
  <!-- Subtle grid lines -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4"/>
  <path d="M100 0 V360 M200 0 V360 M300 0 V360 M400 0 V360 M500 0 V360" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4"/>

  <!-- UI Window Container -->
  <rect x="40" y="35" width="520" height="290" rx="12" fill="#0b1329" stroke="#1e3a5f" stroke-width="1.5"/>
  <!-- Window Header -->
  <rect x="40" y="35" width="520" height="36" rx="12" fill="#0f1f3d"/>
  <circle cx="65" cy="53" r="5" fill="#ef4444"/>
  <circle cx="82" cy="53" r="5" fill="#eab308"/>
  <circle cx="99" cy="53" r="5" fill="#22c55e"/>
  <text x="300" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">MedXanalysis • AI Medical Diagnostic Platform</text>

  <!-- Left Panel: ECG & Health Metrics -->
  <rect x="60" y="90" width="280" height="130" rx="8" fill="#081021" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="115" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">ECG &amp; BIOMETRIC TELEMETRY</text>
  
  <!-- Pulse Line -->
  <path d="M75 165 L115 165 L125 145 L135 185 L145 125 L155 195 L165 165 L205 165 L215 145 L225 180 L235 130 L245 190 L255 165 L320 165" fill="none" stroke="url(#neon-cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Diagnostic Status pill -->
  <rect x="80" y="190" width="105" height="20" rx="10" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
  <text x="132" y="204" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">AI CONFIDENCE 98.4%</text>

  <!-- Right Panel: AI Neural Nodes -->
  <rect x="360" y="90" width="180" height="215" rx="8" fill="#081021" stroke="#1e293b" stroke-width="1"/>
  <text x="380" y="115" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="600">DIAGNOSTIC PIPELINE</text>
  
  <!-- Node circles and connections -->
  <line x1="400" y1="150" x2="450" y2="180" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="400" y1="210" x2="450" y2="180" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="450" y1="180" x2="500" y2="150" stroke="#00e5ff" stroke-width="2"/>
  <line x1="450" y1="180" x2="500" y2="210" stroke="#00e5ff" stroke-width="2"/>

  <circle cx="400" cy="150" r="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
  <text x="400" y="154" fill="#c7d2fe" font-family="sans-serif" font-size="9" text-anchor="middle">MRI</text>

  <circle cx="400" cy="210" r="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
  <text x="400" y="214" fill="#c7d2fe" font-family="sans-serif" font-size="9" text-anchor="middle">LAB</text>

  <circle cx="450" cy="180" r="18" fill="#0f2b3c" stroke="#00e5ff" stroke-width="2.5"/>
  <text x="450" y="184" fill="#00e5ff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AI</text>

  <circle cx="500" cy="150" r="14" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="500" y="154" fill="#a7f3d0" font-family="sans-serif" font-size="9" text-anchor="middle">DOC</text>

  <circle cx="500" cy="210" r="14" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="500" y="214" fill="#a7f3d0" font-family="sans-serif" font-size="9" text-anchor="middle">REP</text>

  <text x="450" y="270" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Next.js • Prisma • PyTorch</text>

  <!-- Bottom stat bar in left -->
  <rect x="60" y="235" width="280" height="70" rx="8" fill="#081021" stroke="#1e293b" stroke-width="1"/>
  <text x="75" y="258" fill="#94a3b8" font-family="sans-serif" font-size="11">Automated Pathology Summary</text>
  <rect x="75" y="270" width="250" height="8" rx="4" fill="#1e293b"/>
  <rect x="75" y="270" width="210" height="8" rx="4" fill="url(#neon-cyan)"/>
  <text x="75" y="295" fill="#38bdf8" font-family="monospace" font-size="10">84% Faster Clinician Review Time</text>
</svg>
