<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="nasm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#nasm-bg)"/>

  <!-- Window Frame -->
  <rect x="40" y="35" width="520" height="290" rx="12" fill="#020617" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="35" width="520" height="36" rx="12" fill="#0b1329"/>
  <circle cx="65" cy="53" r="5" fill="#ef4444"/>
  <circle cx="82" cy="53" r="5" fill="#eab308"/>
  <circle cx="99" cy="53" r="5" fill="#22c55e"/>
  <text x="300" y="58" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">nasm-reader • x86 Assembly Parser &amp; Byte Disassembler</text>

  <!-- Left: Assembly Hex & Mnemonic stream -->
  <rect x="60" y="85" width="310" height="220" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
  <text x="75" y="110" fill="#64748b" font-family="monospace" font-size="10">OFFSET    HEX BYTES        INSTRUCTION</text>
  <line x1="75" y1="118" x2="355" y2="118" stroke="#1e293b" stroke-width="1"/>

  <text x="75" y="140" fill="#38bdf8" font-family="monospace" font-size="11">0x004010  55               push rbp</text>
  <text x="75" y="162" fill="#38bdf8" font-family="monospace" font-size="11">0x004011  48 89 E5         mov  rbp, rsp</text>
  <text x="75" y="184" fill="#38bdf8" font-family="monospace" font-size="11">0x004014  48 83 EC 20      sub  rsp, 32</text>
  <text x="75" y="206" fill="#00e5ff" font-family="monospace" font-size="11">0x004018  B8 01 00 00 00   mov  eax, 1</text>
  <text x="75" y="228" fill="#00e5ff" font-family="monospace" font-size="11">0x00401D  BF 00 00 00 00   mov  edi, 0</text>
  <text x="75" y="250" fill="#a78bfa" font-family="monospace" font-size="11">0x004022  0F 05            syscall</text>
  <text x="75" y="272" fill="#64748b" font-family="monospace" font-size="11">0x004024  C9 C3            leave; ret</text>

  <!-- Right: CPU Register State & Symbol Table -->
  <rect x="385" y="85" width="160" height="220" rx="8" fill="#080e1e" stroke="#1e293b" stroke-width="1"/>
  <text x="400" y="110" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="bold">REGISTER STATE</text>
  
  <g transform="translate(400, 125)">
    <text x="0" y="15" fill="#94a3b8" font-family="monospace" font-size="10">RAX:</text>
    <text x="40" y="15" fill="#34d399" font-family="monospace" font-size="10">0x00000001</text>
    <text x="0" y="35" fill="#94a3b8" font-family="monospace" font-size="10">RBX:</text>
    <text x="40" y="35" fill="#e2e8f0" font-family="monospace" font-size="10">0x7FFE24A0</text>
    <text x="0" y="55" fill="#94a3b8" font-family="monospace" font-size="10">RCX:</text>
    <text x="40" y="55" fill="#e2e8f0" font-family="monospace" font-size="10">0x00000000</text>
    <text x="0" y="75" fill="#94a3b8" font-family="monospace" font-size="10">RDX:</text>
    <text x="40" y="75" fill="#e2e8f0" font-family="monospace" font-size="10">0x00401000</text>
    <text x="0" y="95" fill="#94a3b8" font-family="monospace" font-size="10">RSP:</text>
    <text x="40" y="95" fill="#38bdf8" font-family="monospace" font-size="10">0x7FFF0040</text>
    <text x="0" y="115" fill="#94a3b8" font-family="monospace" font-size="10">RIP:</text>
    <text x="40" y="115" fill="#fbbf24" font-family="monospace" font-size="10">0x00401024</text>
  </g>

  <rect x="400" y="258" width="130" height="26" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="465" y="275" fill="#c7d2fe" font-family="monospace" font-size="9" text-anchor="middle">ELF64 PARSED OK</text>
</svg>
