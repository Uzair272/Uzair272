<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="edu-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#edu-bg)"/>

  <!-- Tech Grid Background -->
  <path d="M50 0 V360 M150 0 V360 M250 0 V360 M350 0 V360 M450 0 V360 M550 0 V360" stroke="#1f2937" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#1f2937" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Outer Window -->
  <rect x="40" y="35" width="520" height="290" rx="12" fill="#090f1d" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="40" y="35" width="520" height="36" rx="12" fill="#0c172e"/>
  <circle cx="65" cy="53" r="5" fill="#ef4444"/>
  <circle cx="82" cy="53" r="5" fill="#eab308"/>
  <circle cx="99" cy="53" r="5" fill="#10b981"/>
  <text x="300" y="58" fill="#9ca3af" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">EduSense • Facial Recognition Attendance Engine</text>

  <!-- Left Side: Camera Scanner Viewport -->
  <rect x="65" y="85" width="260" height="220" rx="8" fill="#030712" stroke="#1f2937" stroke-width="1.5"/>
  
  <!-- Face outline & bounding box -->
  <rect x="115" y="115" width="160" height="150" rx="10" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="10 5"/>
  <!-- Corner brackets -->
  <path d="M110 130 V110 H130" stroke="#10b981" stroke-width="3" fill="none"/>
  <path d="M260 110 H280 V130" stroke="#10b981" stroke-width="3" fill="none"/>
  <path d="M110 250 V270 H130" stroke="#10b981" stroke-width="3" fill="none"/>
  <path d="M260 270 H280 V250" stroke="#10b981" stroke-width="3" fill="none"/>

  <!-- Scanning Line -->
  <line x1="110" y1="180" x2="280" y2="180" stroke="#34d399" stroke-width="2"/>
  
  <!-- Abstract Face vector inside camera -->
  <ellipse cx="195" cy="180" rx="35" ry="45" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="182" cy="170" r="4" fill="#34d399"/>
  <circle cx="208" cy="170" r="4" fill="#34d399"/>
  <path d="M185 202 Q195 212 205 202" fill="none" stroke="#34d399" stroke-width="2"/>

  <!-- Match Banner -->
  <rect x="120" y="275" width="150" height="22" rx="4" fill="#065f46" fill-opacity="0.8"/>
  <text x="195" y="290" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">MATCH: STUDENT #272</text>

  <!-- Right Side: Metrics & Role Portal Cards -->
  <rect x="345" y="85" width="195" height="65" rx="8" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
  <text x="360" y="105" fill="#9ca3af" font-family="sans-serif" font-size="10">ATTENDANCE RATE</text>
  <text x="360" y="135" fill="#34d399" font-family="sans-serif" font-size="24" font-weight="bold">99.2%</text>
  <text x="445" y="133" fill="#6ee7b7" font-family="monospace" font-size="11">Real-time Sync</text>

  <rect x="345" y="160" width="195" height="145" rx="8" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
  <text x="360" y="185" fill="#e5e7eb" font-family="sans-serif" font-size="12" font-weight="600">Active Portals</text>

  <!-- Role badges -->
  <g transform="translate(360, 200)">
    <rect width="165" height="26" rx="6" fill="#1e293b"/>
    <circle cx="16" cy="13" r="5" fill="#10b981"/>
    <text x="30" y="17" fill="#e2e8f0" font-family="sans-serif" font-size="11">Admin Dashboard</text>
  </g>
  <g transform="translate(360, 233)">
    <rect width="165" height="26" rx="6" fill="#1e293b"/>
    <circle cx="16" cy="13" r="5" fill="#06b6d4"/>
    <text x="30" y="17" fill="#e2e8f0" font-family="sans-serif" font-size="11">Instructor Roster</text>
  </g>
  <g transform="translate(360, 266)">
    <rect width="165" height="26" rx="6" fill="#1e293b"/>
    <circle cx="16" cy="13" r="5" fill="#a855f7"/>
    <text x="30" y="17" fill="#e2e8f0" font-family="sans-serif" font-size="11">Student Verification</text>
  </g>
</svg>
