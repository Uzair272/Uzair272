<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="dual-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#131b2e"/>
    </linearGradient>
    <linearGradient id="city-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="city-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#dual-bg)"/>

  <!-- Window Container -->
  <rect x="40" y="35" width="520" height="290" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="40" y="35" width="520" height="36" rx="12" fill="#0f172a"/>
  <circle cx="65" cy="53" r="5" fill="#ef4444"/>
  <circle cx="82" cy="53" r="5" fill="#eab308"/>
  <circle cx="99" cy="53" r="5" fill="#22c55e"/>
  <text x="300" y="58" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">DualCityEnvDashboard • Real-Time Environmental Telemetry</text>

  <!-- Split Comparison Layout -->
  <!-- Left City: Tokyo -->
  <rect x="60" y="85" width="225" height="220" rx="8" fill="#080e1a" stroke="#0284c7" stroke-width="1"/>
  <text x="80" y="112" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">TOKYO, JP</text>
  <text x="80" y="128" fill="#64748b" font-family="monospace" font-size="10">AQI: 34 • EXCELLENT</text>
  
  <text x="80" y="175" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="bold">18°C</text>
  <text x="175" y="170" fill="#38bdf8" font-family="sans-serif" font-size="12">Partly Cloudy</text>
  
  <!-- Mini chart -->
  <path d="M80 230 C110 215, 140 240, 180 205 C210 230, 240 220, 260 195" fill="none" stroke="url(#city-a)" stroke-width="2.5"/>
  <text x="80" y="270" fill="#94a3b8" font-family="sans-serif" font-size="10">Humidity: 52% | Wind: 14 km/h</text>
  <rect x="80" y="280" width="180" height="8" rx="4" fill="#0284c7" fill-opacity="0.3"/>
  <rect x="80" y="280" width="60" height="8" rx="4" fill="#38bdf8"/>

  <!-- VS Divider in Center -->
  <circle cx="300" cy="195" r="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="300" y="200" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">VS</text>

  <!-- Right City: London -->
  <rect x="315" y="85" width="225" height="220" rx="8" fill="#080e1a" stroke="#f59e0b" stroke-width="1"/>
  <text x="335" y="112" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="bold">LONDON, UK</text>
  <text x="335" y="128" fill="#64748b" font-family="monospace" font-size="10">AQI: 68 • MODERATE</text>

  <text x="335" y="175" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="bold">12°C</text>
  <text x="430" y="170" fill="#fbbf24" font-family="sans-serif" font-size="12">Overcast / Rain</text>

  <!-- Mini chart -->
  <path d="M335 235 C365 245, 395 210, 435 225 C465 200, 495 215, 515 205" fill="none" stroke="url(#city-b)" stroke-width="2.5"/>
  <text x="335" y="270" fill="#94a3b8" font-family="sans-serif" font-size="10">Humidity: 84% | Wind: 22 km/h</text>
  <rect x="335" y="280" width="180" height="8" rx="4" fill="#f59e0b" fill-opacity="0.3"/>
  <rect x="335" y="280" width="125" height="8" rx="4" fill="#fbbf24"/>
</svg>
