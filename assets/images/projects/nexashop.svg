<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="shop-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#191528"/>
    </linearGradient>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#shop-bg)"/>

  <rect x="40" y="35" width="520" height="290" rx="12" fill="#0d111d" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="35" width="520" height="36" rx="12" fill="#18192b"/>
  <circle cx="65" cy="53" r="5" fill="#ef4444"/>
  <circle cx="82" cy="53" r="5" fill="#eab308"/>
  <circle cx="99" cy="53" r="5" fill="#22c55e"/>
  <text x="300" y="58" fill="#fda4af" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">NEXA-SHOP • Modern E-Commerce Platform</text>

  <!-- Product Grid -->
  <g transform="translate(65, 90)">
    <rect width="145" height="210" rx="8" fill="#131929" stroke="#1f293d" stroke-width="1"/>
    <!-- Product Graphic -->
    <rect x="15" y="15" width="115" height="95" rx="6" fill="#0a0f1d"/>
    <circle cx="72" cy="62" r="30" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="72" cy="62" r="14" fill="#fb7185" fill-opacity="0.3"/>
    <text x="15" y="130" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Cyber Audio Pro</text>
    <text x="15" y="150" fill="#fda4af" font-family="sans-serif" font-size="13" font-weight="bold">$249.00</text>
    <rect x="15" y="165" width="115" height="28" rx="4" fill="url(#rose-grad)"/>
    <text x="72" y="183" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Add To Cart</text>
  </g>

  <g transform="translate(225, 90)">
    <rect width="145" height="210" rx="8" fill="#131929" stroke="#1f293d" stroke-width="1"/>
    <!-- Product Graphic -->
    <rect x="15" y="15" width="115" height="95" rx="6" fill="#0a0f1d"/>
    <rect x="42" y="32" width="60" height="60" rx="10" fill="none" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="72" cy="62" r="12" fill="#00e5ff" fill-opacity="0.3"/>
    <text x="15" y="130" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Quantum Watch</text>
    <text x="15" y="150" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">$399.00</text>
    <rect x="15" y="165" width="115" height="28" rx="4" fill="#0284c7"/>
    <text x="72" y="183" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Add To Cart</text>
  </g>

  <g transform="translate(385, 90)">
    <rect width="150" height="210" rx="8" fill="#131929" stroke="#1f293d" stroke-width="1"/>
    <text x="15" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="bold">Order Summary</text>
    <line x1="15" y1="42" x2="135" y2="42" stroke="#334155" stroke-width="1"/>
    <text x="15" y="65" fill="#94a3b8" font-family="sans-serif" font-size="10">Subtotal</text>
    <text x="135" y="65" fill="#f8fafc" font-family="monospace" font-size="10" text-anchor="end">$648.00</text>
    <text x="15" y="90" fill="#94a3b8" font-family="sans-serif" font-size="10">Shipping</text>
    <text x="135" y="90" fill="#34d399" font-family="monospace" font-size="10" text-anchor="end">FREE</text>
    <line x1="15" y1="110" x2="135" y2="110" stroke="#334155" stroke-width="1"/>
    <text x="15" y="135" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Total</text>
    <text x="135" y="135" fill="#f43f5e" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="end">$648.00</text>
    <rect x="15" y="155" width="120" height="38" rx="6" fill="url(#rose-grad)"/>
    <text x="75" y="179" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Checkout Now</text>
  </g>
</svg>
